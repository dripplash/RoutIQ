<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login Repartidor</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="inicio-container">

  <button class="backBtn" onclick="location.href='index.html'">← Volver</button>

  <h2>Login Repartidor</h2>
  <p class="inicio-subtitle">Ingresa tus credenciales</p>

  <input id="user" placeholder="Usuario">
  <input id="pass" placeholder="Contraseña" type="password">

  <button onclick="login()">Ingresar</button>

  <p id="msgError" class="login-error"></p>

</div>

<script>
function login() {
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;

  if (u === "admin" && p === "admin21") {
    location.href = "repartidor.html";
  } else {
    document.getElementById("msgError").innerText = "Usuario o contraseña incorrectos";
  }
}
</script>

</body>
</html>
